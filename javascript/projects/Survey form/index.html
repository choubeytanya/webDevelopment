<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
<div class="container">
    <h1>Survey Form</h1>
    <form>
        <div class="fullName">
            <div class="name">
                <label for=" firstname">First Name:</label>
                <input type="text" id="Firstname" name="Firstname">
            </div>
            <div class="name">
                <label for=" middlename">Middle Name:</label>
                <input type="text" id=middlename" name="middlename">
            </div>
            <div class="name">
                <label for=" lastname">Last Name:</label>
                <input type="text" id=lastname" name="lastname">
            </div>
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id=email" name="email">
        </div>
        <div>
            <label for="Phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone">
        </div>
        <div>
            <label for="address">Address:</label>
            <input type="text" id="address1" name="address1" placeholder="Address 1">
            <input type="text" id="address2" name="address2" placeholder="Address 2">
        </div>
        <div>
            <label for="employment status">employment status: </label>
            <select id="employment status" name="employment status">
                <option value="employed">Employed</option>
                <option value="unemployed">Unemployed</option>
                <option value="student">Student</option>
                <option value="retired">Retired</option>
            </select>
        </div>
        <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label>
        </fieldset>
        <div>
            <label for="feedback">Feedback:</label>
            <textarea id="feedback" name="feedback" rows="4" cols="50" placeholder="Please provide your feedback..."></textarea>
        </div>
        <button type="submit" class="submit">Submit</button>
    
    </form>
</div>  
</body>
</html>
